<!DOCTYPE html>
<html lang="fr" style="background-color: #05070f;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget - Kiitchi Creator</title>
  <link rel="manifest" href="./manifest.json">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap');

    :root {
      --color-income: #00ff9d;
      --color-expense: #ff0055;
      --color-accent: #00f0ff;
      --color-credit: #b026ff;
      --color-bg: #05070f;
    }

    html, body {
      background-color: var(--color-bg);
      color: #e2e8f0;
      min-height: 100vh;
    }

    body {
      font-family: 'Rajdhani', sans-serif;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .font-tech {
      font-family: 'Orbitron', sans-serif;
    }

    .glow-gold {
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.15), inset 0 0 15px rgba(176, 38, 255, 0.05);
      border-color: rgba(0, 240, 255, 0.3);
    }

    .glow-card {
      background: rgba(13, 18, 36, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 240, 255, 0.15);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    .cyber-btn {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.2) 0%, rgba(176, 38, 255, 0.2) 100%);
      border: 1px solid var(--color-accent);
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .cyber-btn:hover {
      box-shadow: 0 0 18px var(--color-accent);
    }

    .tab-btn.active {
      color: var(--color-accent);
      border-bottom: 2px solid var(--color-accent);
      background: rgba(255, 255, 255, 0.05);
    }

    .type-income {
      color: var(--color-income);
      text-shadow: 0 0 8px var(--color-income);
    }

    .type-expense {
      color: var(--color-expense);
      text-shadow: 0 0 8px var(--color-expense);
    }

    .text-accent {
      color: var(--color-accent);
    }

    .text-credit {
      color: var(--color-credit);
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #05070f;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--color-accent);
      border-radius: 3px;
    }
  </style>
</head>
<body class="pb-12">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950/85 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <!-- Logo personnalisé intégré -->
        <div class="w-10 h-10 rounded-xl overflow-hidden shadow-lg shadow-cyan-500/20 border border-cyan-300/30 bg-slate-900 flex items-center justify-center">
          <img src="./logo.png" alt="Logo Budget" class="w-full h-full object-cover">
        </div>
        <div>
          <h1 class="text-2xl font-black font-tech tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-300 to-purple-400">
            BUDGET
          </h1>
          <p class="text-[10px] text-cyan-400/60 font-tech">KIITCHI SYSTEM</p>
        </div>
      </div>

      <!-- Actions : Palette + Export/Import -->
      <div class="flex items-center space-x-2">
        <button onclick="toggleThemeModal(true)" title="Personnaliser les couleurs & fond" class="p-2 rounded-lg border border-slate-700 bg-slate-900 text-slate-300 hover:text-cyan-400 hover:border-cyan-400 transition">
          <i data-lucide="palette" class="w-5 h-5"></i>
        </button>
        <button onclick="exportData()" title="Exporter les données" class="p-2 rounded-lg border border-cyan-500/30 bg-cyan-950/30 text-cyan-400 hover:bg-cyan-500/20 transition">
          <i data-lucide="download" class="w-5 h-5"></i>
        </button>
        <label title="Importer les données" class="p-2 rounded-lg border border-purple-500/30 bg-purple-950/30 text-purple-400 hover:bg-purple-500/20 transition cursor-pointer">
          <i data-lucide="upload" class="w-5 h-5"></i>
          <input type="file" id="importFile" onchange="importData(event)" class="hidden" accept=".json">
        </label>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">

    <!-- SOLDE GLOBAL -->
    <div class="glow-card glow-gold rounded-2xl p-6 relative overflow-hidden">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-xs font-tech uppercase tracking-widest mb-1 flex items-center gap-1.5 opacity-90 text-slate-300">
            <i data-lucide="shield-check" class="w-4 h-4 text-cyan-400"></i>
            Solde Général (Réel à ce jour)
          </p>
          <p id="globalBalance" class="text-4xl sm:text-5xl font-extrabold font-tech type-income">0.00 €</p>
        </div>
        <div class="hidden sm:block opacity-20 text-cyan-400">
          <i data-lucide="coins" class="w-20 h-20"></i>
        </div>
      </div>
    </div>

    <!-- ONGLETS NAVIGATION PRINCIPALE -->
    <div class="flex border-b border-slate-800 font-tech text-sm">
      <button onclick="switchTab('transactions')" id="tab-transactions" class="tab-btn active flex-1 py-3 px-4 text-center font-bold text-slate-400 hover:text-slate-200 transition flex items-center justify-center gap-2">
        <i data-lucide="list" class="w-4 h-4"></i>
        <span>Transactions</span>
      </button>
      <button onclick="switchTab('subscriptions')" id="tab-subscriptions" class="tab-btn flex-1 py-3 px-4 text-center font-bold text-slate-400 hover:text-slate-200 transition flex items-center justify-center gap-2">
        <i data-lucide="repeat" class="w-4 h-4"></i>
        <span>Charges Fixes</span>
      </button>
    </div>

    <!-- SECTION 1 : TRANSACTIONS -->
    <div id="section-transactions" class="space-y-6">

      <!-- Formulaire d'ajout -->
      <div class="glow-card rounded-2xl p-6">
        <h2 class="text-md font-tech text-accent font-bold mb-4 flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-5 h-5"></i>
          <span id="formTitle">Ajouter une Opération</span>
        </h2>

        <form id="transForm" onsubmit="addTransaction(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          <input type="hidden" id="editTransId" value="">

          <div>
            <label class="block text-xs font-tech text-slate-400 mb-1">Date</label>
            <input type="date" id="transDate" required class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-400 transition">
          </div>

          <div>
            <label class="block text-xs font-tech text-slate-400 mb-1">Libellé</label>
            <input type="text" id="label" required placeholder="Ex: Courses, Salaire, Netflix..." class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-400 transition">
          </div>

          <div>
            <label class="block text-xs font-tech text-slate-400 mb-1">Montant (€)</label>
            <input type="number" step="0.01" id="amount" required placeholder="0.00" class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-400 transition">
          </div>

          <div>
            <label class="block text-xs font-tech text-slate-400 mb-1">Type d'opération</label>
            <select id="type" class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-400 transition">
              <option value="expense">Sortie (Dépense)</option>
              <option value="income">Entrée (Revenu)</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-tech text-slate-400 mb-1">Catégorie</label>
            <select id="tag" class
